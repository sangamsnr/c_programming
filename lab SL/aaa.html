<!DOCTYPE html>
<html>
<head>
  <title>Signup Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    form {
      max-width: 400px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #f9f9f9;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>Signup Form</h2>

  <form id="signupForm" onsubmit="return submitForm()">
    <!-- Name -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <!-- Email -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <!-- Contact Number -->
    <label for="contact">Contact Number:</label>
    <input type="tel" id="contact" name="contact" placeholder="10-digit number" required>

    <!-- Username -->
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <!-- Password -->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <!-- Submit Button -->
    <button type="submit">Sign Up</button>
  </form>

  <!-- Message displayed after signup -->
  <p id="message"></p>

  <script>
    function submitForm() {
      // Get input values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");

      // Simple validations
      if (name === "") {
        message.style.color = "red";
        message.textContent = "Name cannot be empty!";
        return false;
      }

      const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}$/;
      if (!emailPattern.test(email)) {
        message.style.color = "red";
        message.textContent = "Please enter a valid email!";
        return false;
      }

      const contactPattern = /^[0-9]{10}$/;
      if (!contactPattern.test(contact)) {
        message.style.color = "red";
        message.textContent = "Contact number must be exactly 10 digits!";
        return false;
      }

      if (username === "") {
        message.style.color = "red";
        message.textContent = "Username cannot be empty!";
        return false;
      }

      if (password.length < 6) {
        message.style.color = "red";
        message.textContent = "Password must be at least 6 characters!";
        return false;
      }

      // If all validations pass, show confirmation interface
      message.style.color = "green";
      message.innerHTML = `
        Signup Successful!<br>
        <strong>Details:</strong><br>
        Name: ${name}<br>
        Email: ${email}<br>
        Contact: ${contact}<br>
        Username: ${username}
      `;

      // Optionally, clear form
      document.getElementById("signupForm").reset();

      return false; // Prevent actual form submission
    }
  </script>
</body>
</html>
